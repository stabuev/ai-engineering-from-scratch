<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Перенаправление на урок - AI Engineering from Scratch</title>
  <!--
    Legacy URL shim. Lessons used to live at lesson.html?path=phases/NN-x/NN-y
    (&lang=en) and were rendered client-side. They are now prerendered as
    static pages at /<phase-slug>/<lesson-slug>.html (ru) and
    /en/<phase-slug>/<lesson-slug>.html (en) — see site/build.js. This page
    only maps old links to the new URLs. A JS redirect (not noindex) so
    crawlers transfer old-URL signals to the new pages. Relative
    location.replace keeps it working under any proxy path prefix.
  -->
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var path = params.get('path') || '';
      var m = path.match(/phases\/\d+-([^/]+?)\/\d+-([^/]+?)\/?$/);
      var langPrefix = params.get('lang') === 'en' ? 'en/' : '';
      window.location.replace(m ? langPrefix + m[1] + '/' + m[2] + '.html' : 'catalog.html');
    })();
  </script>
</head>
<body>
  <p><a href="catalog.html">Каталог курса AI Engineering from Scratch</a></p>
</body>
</html>
