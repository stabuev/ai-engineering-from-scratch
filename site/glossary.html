    .glossary-list {

      gap: 16px;

    .glossary-card {

      flex-wrap: wrap;

      min-width: 200px;
    }

    .glossary-col-label {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .glossary-col-says {
      color: var(--text-muted);
      font-size: 0.95rem;
      font-style: italic;
    }

    .glossary-col-means {
      color: var(--text);
      font-size: 0.95rem;
      line-height: 1.5;
    }

    .glossary-empty {
      text-align: center;
      padding: 48px 24px;
      color: var(--text-muted);
      font-size: 1.1rem;
    }

    @media (max-width: 768px) {

        gap: 12px;
      }

  <script>
    (function () {
      var PAGE_LANG = location.pathname.indexOf('/en/') !== -1 ? 'en' : 'ru';
      document.documentElement.lang = PAGE_LANG;

      var STR = {
        ru: {
          title: 'Глоссарий ИИ',
          subtitle: 'Что <em>говорят</em> vs что на самом деле <em>значит</em>',
          searchPlaceholder: 'Поиск терминов…',
          count: function (n, total) { return n + ' из ' + total + ' терминов'; },
          empty: 'Ничего не найдено по запросу.',
          labelSays: 'Что говорят',
          labelMeans: 'Что это на самом деле',
          footerTagline: 'AI Engineering from Scratch · открытый код · бесплатно навсегда.',
          report: 'Сообщить / Предложить',
          quoteOpen: '«', quoteClose: '»',
          nav: { 'contents': 'Содержание', 'catalog': 'Каталог', 'roadmap': 'Дорожная карта', 'glossary': 'Глоссарий', 'home': 'Главная' }
        },
        en: {
          title: 'AI Glossary',
          subtitle: 'What people <em>say</em> vs what things actually <em>mean</em>',
          searchPlaceholder: 'Search terms…',
          count: function (n, total) { return n + ' of ' + total + ' terms'; },
          empty: 'No terms match your search.',
          labelSays: 'What people say',
          labelMeans: 'What it actually means',
          footerTagline: 'AI Engineering from Scratch · open source · free forever.',
          report: 'Report / Suggest',
          quoteOpen: '"', quoteClose: '"',
          nav: { 'contents': 'Contents', 'catalog': 'Catalog', 'roadmap': 'Roadmap', 'glossary': 'Glossary', 'home': 'Home' }
        }
      };
      var S = STR[PAGE_LANG];

      // Localize static chrome (nav, footer, header) from the strings table.
      document.querySelectorAll('[data-i18n]').forEach(function (el) {
        var key = el.getAttribute('data-i18n');
        if (S[key] != null) el.textContent = S[key];
      });
      document.querySelectorAll('[data-i18n-html]').forEach(function (el) {
        var key = el.getAttribute('data-i18n-html');
        if (S[key] != null) el.innerHTML = S[key];
      });
      document.querySelectorAll('[data-nav]').forEach(function (el) {
        var key = el.getAttribute('data-nav');
        if (S.nav && S.nav[key] != null) el.textContent = S.nav[key];
      });
      var searchInputEl = document.getElementById('glossarySearch');
      if (searchInputEl) searchInputEl.setAttribute('placeholder', S.searchPlaceholder);

      var root = document.documentElement;
      var stored = localStorage.getItem('theme');
      if (stored) {
        root.setAttribute('data-theme', stored);
      } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
        root.setAttribute('data-theme', 'dark');
      } else {
        root.setAttribute('data-theme', 'light');
      }

      function updateIcon() {
        var icon = document.getElementById('themeIcon');
        if (!icon) return;
        icon.textContent = root.getAttribute('data-theme') === 'light' ? 'N' : 'D';
      }

      updateIcon();

      // Language toggle: swap between /glossary.html (ru) and /en/glossary.html.
      var langBtn = document.getElementById('langToggle');
      if (langBtn) {
        langBtn.textContent = PAGE_LANG.toUpperCase();
        langBtn.addEventListener('click', function () {
          window.location.href = PAGE_LANG === 'en' ? '../glossary.html' : 'en/glossary.html';
        });
      }

      document.addEventListener('DOMContentLoaded', function () {
        updateIcon();

        var btn = document.getElementById('themeToggle');
        if (btn) {
          btn.addEventListener('click', function () {
            var next = root.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
            root.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
            updateIcon();
          });
        }

        var searchInput = document.getElementById('glossarySearch');
        var listEl = document.getElementById('glossaryList');
        var countEl = document.getElementById('glossaryCount');

        function escapeHtml(str) {
          var div = document.createElement('div');
          div.textContent = str;
          return div.innerHTML;
        }

        // Pull the active-language fields from a bilingual glossary entry.
        // Top-level is Russian; English lives under `.en`. Falls back to the
        // top-level fields if the English copy is missing.
        function pick(t) {
          if (PAGE_LANG === 'en' && t.en) return t.en;
          return { term: t.term, says: t.says, means: t.means };
        }

        function renderGlossary(filter) {
          var terms = GLOSSARY;
          if (filter) {
            var q = filter.toLowerCase();
            terms = terms.filter(function (t) {
              var v = pick(t);
              return v.term.toLowerCase().indexOf(q) !== -1 ||
                v.says.toLowerCase().indexOf(q) !== -1 ||
                v.means.toLowerCase().indexOf(q) !== -1;
            });
          }

          countEl.textContent = S.count(terms.length, GLOSSARY.length);

          if (terms.length === 0) {
            listEl.innerHTML = '<div class="glossary-empty">' + escapeHtml(S.empty) + '</div>';
            return;
          }

          var html = '';
          for (var i = 0; i < terms.length; i++) {
            var t = pick(terms[i]);
            html += '<div class="glossary-card">';
            html += '<div class="glossary-term">' + escapeHtml(t.term) + '</div>';
            html += '<div class="glossary-row">';
            html += '<div class="glossary-col">';
            html += '<div class="glossary-col-label">' + escapeHtml(S.labelSays) + '</div>';
            html += '<div class="glossary-col-says">' + S.quoteOpen + escapeHtml(t.says) + S.quoteClose + '</div>';
            html += '</div>';
            html += '<div class="glossary-col">';
            html += '<div class="glossary-col-label">' + escapeHtml(S.labelMeans) + '</div>';
            html += '<div class="glossary-col-means">' + escapeHtml(t.means) + '</div>';
            html += '</div>';
            html += '</div>';
            html += '</div>';
          }
          listEl.innerHTML = html;
        }

        renderGlossary('');

        if (searchInput) {
          searchInput.addEventListener('input', function () {
            renderGlossary(searchInput.value.trim());
          });
        }
      });
    })();
  </script>
