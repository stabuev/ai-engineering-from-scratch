name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  consistency:
    name: lessons.json ↔ disk ↔ generated files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate manifest and generated content
        run: node site/build.js --check
