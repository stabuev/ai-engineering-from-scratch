# requirements.lock — exact, reproducible environment for AI Engineering from Scratch.
#
# Pinned, internally consistent set (uv-resolved). The from-scratch core that the
# Phase 0-3 lessons were actually run against is pinned to its tested versions:
#   numpy 1.26.4, torch 2.7.1, torchvision 0.22.1, torchaudio 2.7.1,
#   scikit-learn 1.7.0, pandas 2.2.2, matplotlib 3.9.2, pillow 10.4.0, jupyter 1.x.
# The rest is pinned to the course's target generation (transformers 4.x, datasets 3.x)
# for coherence; later-phase libraries were not independently re-run in this pass.
#
# Install the exact set:   uv pip install -r requirements.lock   (or: pip install -r requirements.lock)
# For latest/flexible:     pip install -r requirements.txt
# Regenerate after editing requirements.txt:  uv pip compile requirements.txt -o requirements.lock

